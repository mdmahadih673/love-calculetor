<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Calculator ❤️</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: #ff4d6d;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 2px solid #ffb3c1;
        border-radius: 10px;
        outline: none;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #ff4d6d;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #e63956;
      }

      #result {
        margin-top: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #ff4d6d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>❤️ Love Calculator ❤️</h1>

      <input type="text" id="name1" placeholder="Your Name" />
      <input type="text" id="name2" placeholder="Crush Name" />

      <button onclick="calculateLove()">Calculate</button>

      <div id="result"></div>
    </div>

    <script>
      function calculateLove() {
        let name1 = document.getElementById("name1").value;
        let name2 = document.getElementById("name2").value;

        if (name1 === "" || name2 === "") {
          document.getElementById("result").innerHTML =
            "Please enter both names!";
          return;
        }

        let love = Math.floor(Math.random() * 41) + 60;

        document.getElementById("result").innerHTML = `${love}% ❤️`;
      }
    </script>
  </body>
</html>
